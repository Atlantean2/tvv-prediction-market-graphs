<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q2</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Recession Odds</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-P2.webp" alt="Crowd vs economists: who is calmer about a US recession?" loading="lazy"><figcaption><span class="t">Chart P2 (week of Oct 25, 2026). Crowd vs economists: who is calmer about a US recession?</span><p>Bettors have priced recession risk down steadily, from 44% in late September 2025 to 7.5% now, even as the 10-year yield crossed 5% in mid-September 2026. Professional forecasters in the Philadelphia Fed&#x27;s Survey of Professional Forecasters still put the chance of a negative-GDP quarter at 16.6% for the next quarter and 20% three quarters out (Q3 2026 survey, the latest in the file). The two questions are not identical: the market asks about a recession by Dec 31, 2026 under its own rules, with about two months left, so time decay explains part of the drop. Still, the market is two to three times calmer than the experts. The next SPF survey (normally mid-November) is the next check.</p><p>Sources: <a href="https://polymarket.com/event/us-recession-by-end-of-2026">Polymarket &#x27;US recession by end of 2026?&#x27;</a> <a href="https://www.philadelphiafed.org/surveys-and-data/real-time-data-research/survey-of-professional-forecasters">SPF data file Median_RECESS_Level.xlsx</a></p></figcaption></figure></main></body></html>
