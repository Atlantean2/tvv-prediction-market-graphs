<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q4</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. Fed &amp; Markets</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-30-P6.webp" alt="Bettors price a December Fed hike at about 70%; futures said 81–88%" loading="lazy"><figcaption><span class="t">Chart P6 (week of Oct 30, 2026). Bettors price a December Fed hike at about 70%; futures said 81–88%</span><p>Odds of a 25 bp hike on Dec 9: Polymarket 70.5%, Kalshi 69% vs FedWatch 81–88% (Oct 28). Later reports put FedWatch at 74.9–79.6% on Oct 29–30, so the gap has narrowed. Data to Oct 30.</p><ul><li>Sep 16, 2026: the Fed hiked 25 bp to 3.75–4.00%, taking the FRED DFEDTARU upper bound to 4.00.</li><li>Oct 28, 2026: the Fed held, by a 10–2 vote with two dissents favouring a hike.</li><li>Oct 28, 2026: CME FedWatch put a December hike at 81.4% before the decision and 87.5% at 2:06 PM ET (InfoMoney).</li><li>Oct 30, 2026, 5:49 PM ET: Polymarket has a hike at 70.5% and no change at 27.5%; Kalshi has a hike at 69%.</li><li>Oct 29–30, 2026: later reports of CME FedWatch put a December hike at 79.6% (BlockBeats via KuCoin) and 74.9% (FXBus), about 4–11 points above the prediction markets.</li></ul><p class="nt">Note: FedWatch figures are third-party reports of the CME tool, not a CME download; the CME FedWatch page could not be read directly. InfoMoney&#x27;s post-decision figures sum to 101.8% (87.5% hike, 13.8% hold, 0.5% for 50 bp), so one of them is probably stale.</p><p>Sources: <a href="https://polymarket.com/event/fed-decision-in-december-20260729232808632">Polymarket, Fed decision in December</a> <a href="https://kalshi.com/markets/kxfeddecision">Kalshi, Fed decision</a> <a href="https://www.infomoney.com.br/economia/cme-mercado-mantem-aposta-de-alta-de-juros-em-dezembro-pelo-fed-apos-decisao/">InfoMoney, CME FedWatch after the Oct 28 decision</a> <a href="https://fred.stlouisfed.org/series/DFEDTARU">FRED, federal funds target range upper limit (DFEDTARU)</a> <a href="https://www.kucoin.com/news/flash/december-25-basis-point-rate-hike-probability-at-79-6">BlockBeats via KuCoin, CME FedWatch 79.6% (Oct 29-30)</a> <a href="https://www.fxbus.com/en/news/20261030060452313986.html">FXBus, CME FedWatch 74.9% (Oct 30)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-P7.webp" alt="Markets saw October&#x27;s Fed hold coming: 95% by decision day" loading="lazy"><figcaption><span class="t">Chart P7 (week of Oct 30, 2026). Markets saw October&#x27;s Fed hold coming: 95% by decision day</span><p>Polymarket &quot;no change&quot; odds rose from 48.5% (Jun 18) to 95% (Oct 28, 8 AM ET); Fed held. Sources: Polymarket, Kalshi.</p><ul><li>Jun 18, 2026: Polymarket priced no change at 48.5% and a 25 bp hike at 48%.</li><li>Sep 16–29, 2026: after the September hike, the odds of a second hike briefly topped 65% and &quot;no change&quot; fell to about 31%.</li><li>Oct 28, 2026, 8 AM ET: no change stood at 95.05%. The Fed held at 3.75–4.00%. Kalshi showed 96% at the close on Oct 27.</li><li>Polymarket volume on this market was $101.9M, the largest of the five charts.</li></ul><p>Sources: <a href="https://polymarket.com/event/fed-decision-in-october-20260617190323537">Polymarket, Fed decision in October</a> <a href="https://kalshi.com/markets/kxfeddecision">Kalshi, Fed decision</a> <a href="https://fred.stlouisfed.org/series/DFEDTARU">FRED, federal funds target range upper limit (DFEDTARU)</a></p></figcaption></figure></main></body></html>
