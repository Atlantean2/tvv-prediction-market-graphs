<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q5</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q5")</script></head><body><main id="issue"><h2 class="desk">Q5. Senate Races</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-01-P8.webp" alt="Bettors see Democratic flips in TX, OH, ME and AK; Kansas is a toss-up" loading="lazy"><figcaption><span class="t">Chart P8 (week of Nov 1, 2026). Bettors see Democratic flips in TX, OH, ME and AK; Kansas is a toss-up</span><p>Polymarket win prices for 19 Senate races with active markets, snapshot Nov 01, 2026 (two days before the Nov 3 election). Non-Republican share is 1 minus the Republican contract price. Bettors favour Democrats in the Republican-held seats of Texas (Talarico 70%), Ohio (Brown 72%), Maine (Jackson 68%) and Alaska (Peltola 72%), and in open Michigan (El-Sayed 80%). Kansas is a toss-up (Hamilton 52%), and Iowa leans Republican (Hinson 58%). Texas is the most heavily traded race at $9.6M. Prices are crowd odds, not forecasts, and thin markets (under $0.5M) can move on small trades.</p><ul><li>Nebraska: independent challenger 27% vs Ricketts 75%. South Carolina: Andrews (D) 26%.</li><li>Prices are the Yes price on each candidate&#x27;s contract and need not sum to exactly 100% (spreads and fees).</li><li>Same snapshot: Polymarket&#x27;s Senate-control market gives Democrats 72.5% and Republicans 28.5%.</li></ul><p class="nt">Note: Peltola is the Democratic candidate in Alaska; the market lists her without party. Some race-level markets are thin, so a single large order can shift a price several points.</p><p>Sources: <a href="https://polymarket.com/event/texas-senate-election-winner">Polymarket, Texas Senate Election Winner</a> <a href="https://polymarket.com/event/ohio-senate-election-winner">Polymarket, Ohio Senate Election Winner</a> <a href="https://polymarket.com/event/maine-senate-election-winner">Polymarket, Maine Senate Election Winner</a> <a href="https://polymarket.com/event/alaska-senate-election-winner">Polymarket, Alaska Senate Election Winner</a> <a href="https://polymarket.com/event/iowa-senate-election-winner">Polymarket, Iowa Senate Election Winner</a> <a href="https://polymarket.com/event/kansas-senate-election-winner">Polymarket, Kansas Senate Election Winner</a> <a href="https://polymarket.com/event/which-party-will-win-the-senate-in-2026">Polymarket, Senate control</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-P9.webp" alt="Five months of Senate betting: the market moved toward Democrats in most key races" loading="lazy"><figcaption><span class="t">Chart P9 (week of Nov 1, 2026). Five months of Senate betting: the market moved toward Democrats in most key races</span><p>Daily Polymarket prices since Jun 1, 2026 for the Democratic or non-Republican candidate in seven key Senate races. Texas 40% to 70%; Ohio 52% to 74%; Maine 64% to 68%; Alaska 58% to 74%; Iowa 38% to 42%; Kansas 18% to 52%; Michigan 72% to 82%. The biggest swings were Kansas (+34 pts) and Texas (+30 pts), both of which flipped from Republican-leaning to even or Democratic-leaning. Iowa has stayed Republican-leaning throughout.</p><p class="nt">Note: Daily closing midpoints from Polymarket&#x27;s public price-history API. Odds are not polls; markets can be moved by a few large traders, and US users trade mainly on regulated venues such as Kalshi.</p><p>Sources: <a href="https://polymarket.com/event/texas-senate-election-winner">Polymarket, Texas Senate Election Winner</a> <a href="https://polymarket.com/event/ohio-senate-election-winner">Polymarket, Ohio Senate Election Winner</a> <a href="https://polymarket.com/event/maine-senate-election-winner">Polymarket, Maine Senate Election Winner</a> <a href="https://polymarket.com/event/alaska-senate-election-winner">Polymarket, Alaska Senate Election Winner</a> <a href="https://polymarket.com/event/iowa-senate-election-winner">Polymarket, Iowa Senate Election Winner</a> <a href="https://polymarket.com/event/kansas-senate-election-winner">Polymarket, Kansas Senate Election Winner</a> <a href="https://polymarket.com/event/michigan-senate-election-winner">Polymarket, Michigan Senate Election Winner</a> <a href="https://docs.polymarket.com/developers/CLOB/timeseries">Polymarket CLOB price-history API</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-08-P10.webp" alt="Markets called the Senate flips; several high-confidence favorites barely won" loading="lazy"><figcaption><span class="t">Chart P10 (week of Nov 8, 2026). Markets called the Senate flips; several high-confidence favorites barely won</span><p>Polymarket prices at 5:02 p.m. ET on Nov 2 (the day before the election), versus unofficial reported vote margins fetched Nov 8. Florida’s Ashley Moody was an 87.5% favorite and led 50.86% to 48.00% (+2.9 pts); Louisiana’s Julia Letlow was 86.5% and led 50.88% to 49.12% (+1.8 pts) as of Nov 8. The two misses in this set were South Carolina, where Darline Graham Nordone was a 68.5% favorite and Annie Andrews led 51.14% to 46.64%, and Iowa, a coin flip (Ashley Hinson 51.5%) that Josh Turek led 50.45% to 46.34%. The advertised Democratic flips landed in Texas (Talarico 75.5% in the market, +12.1 pts), Ohio (Brown 70.5%, +4.9 pts) and Maine (Jackson 74.5%, +6.1 pts on Decision Desk HQ’s count). Alaska’s Mary Peltola was a 72.5% favorite and led 48.17% to 47.88% (+0.3 pts) in Ballot List’s unofficial Nov 4 update; that race is not treated as called here.</p><ul><li>Nov 2 snapshot: Moody 87.5% and Letlow 86.5% led by 2.9 and 1.8 points.</li><li>Misses in this set: South Carolina (Graham 68.5%) and Iowa (Hinson 51.5%).</li><li>Texas +12.1 pts (Talarico 75.5%); Ohio +4.9 (Brown 70.5%); Maine +6.1 (Jackson 74.5%).</li><li>Alaska +0.3 pts unofficial (Peltola 72.5% on Nov 2); not treated as called.</li></ul><p class="nt">Note: Margins use reported candidate percentages, which need not sum to 100% because of third-party and write-in votes. Nebraska’s non-Republican price is the Independent (Dan Osborn) contract, not a Democrat. Opposing view on X: @byajperez said Kalshi ‘is supposed to be better than polls, but it failed’ on the Mississippi Senate count (https://x.com/byajperez/status/2118169107417952515); @0xForecaster argued Kalshi-vs-Polymarket Brier comparisons are distorted by different sample sizes (https://x.com/0xForecaster/status/2119387222008869196). Kalshi-marketing posts cited a 479-of-487 / 98% hit rate (https://x.com/TheWorldEye_/status/2118230124269388169). This chart does not copy the existing 19-of-20 scorecard.</p><p>Sources: <a href="https://gamma-api.polymarket.com/events?tag_slug=midterms">Polymarket midterm snapshot, Nov 2, 2026 5:02 p.m. ET</a> <a href="https://ballotlist.com/2026-election-results/senate">Ballot List 2026 Senate results (state-reported unofficial counts)</a> <a href="https://votes.decisiondeskhq.com/races/2026-11-03/maine-us-senate-general-election">Decision Desk HQ: 2026 Maine U.S. Senate results</a> <a href="https://polymarket.com/event/texas-senate-election-winner">Polymarket Texas Senate</a> <a href="https://polymarket.com/event/south-carolina-senate-election-winner">Polymarket South Carolina Senate</a></p></figcaption></figure></main></body></html>
