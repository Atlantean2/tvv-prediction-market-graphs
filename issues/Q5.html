<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q5</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q5")</script></head><body><main id="issue"><h2 class="desk">Q5. Senate Races</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-01-P8.webp" alt="Bettors see Democratic flips in TX, OH, ME and AK; Kansas is a toss-up" loading="lazy"><figcaption><span class="t">Chart P8 (week of Nov 1, 2026). Bettors see Democratic flips in TX, OH, ME and AK; Kansas is a toss-up</span><p>Polymarket win prices for 19 Senate races with active markets, snapshot Nov 01, 2026 (two days before the Nov 3 election). Non-Republican share is 1 minus the Republican contract price. Bettors favour Democrats in the Republican-held seats of Texas (Talarico 70%), Ohio (Brown 72%), Maine (Jackson 68%) and Alaska (Peltola 72%), and in open Michigan (El-Sayed 80%). Kansas is a toss-up (Hamilton 52%), and Iowa leans Republican (Hinson 58%). Texas is the most heavily traded race at $9.6M. Prices are crowd odds, not forecasts, and thin markets (under $0.5M) can move on small trades.</p><ul><li>Nebraska: independent challenger 27% vs Ricketts 75%. South Carolina: Andrews (D) 26%.</li><li>Prices are the Yes price on each candidate&#x27;s contract and need not sum to exactly 100% (spreads and fees).</li><li>Same snapshot: Polymarket&#x27;s Senate-control market gives Democrats 72.5% and Republicans 28.5%.</li></ul><p class="nt">Note: Peltola is the Democratic candidate in Alaska; the market lists her without party. Some race-level markets are thin, so a single large order can shift a price several points.</p><p>Sources: <a href="https://polymarket.com/event/texas-senate-election-winner">Polymarket, Texas Senate Election Winner</a> <a href="https://polymarket.com/event/ohio-senate-election-winner">Polymarket, Ohio Senate Election Winner</a> <a href="https://polymarket.com/event/maine-senate-election-winner">Polymarket, Maine Senate Election Winner</a> <a href="https://polymarket.com/event/alaska-senate-election-winner">Polymarket, Alaska Senate Election Winner</a> <a href="https://polymarket.com/event/iowa-senate-election-winner">Polymarket, Iowa Senate Election Winner</a> <a href="https://polymarket.com/event/kansas-senate-election-winner">Polymarket, Kansas Senate Election Winner</a> <a href="https://polymarket.com/event/which-party-will-win-the-senate-in-2026">Polymarket, Senate control</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-P9.webp" alt="Five months of Senate betting: the market moved toward Democrats in most key races" loading="lazy"><figcaption><span class="t">Chart P9 (week of Nov 1, 2026). Five months of Senate betting: the market moved toward Democrats in most key races</span><p>Daily Polymarket prices since Jun 1, 2026 for the Democratic or non-Republican candidate in seven key Senate races. Texas 40% to 70%; Ohio 52% to 74%; Maine 64% to 68%; Alaska 58% to 74%; Iowa 38% to 42%; Kansas 18% to 52%; Michigan 72% to 82%. The biggest swings were Kansas (+34 pts) and Texas (+30 pts), both of which flipped from Republican-leaning to even or Democratic-leaning. Iowa has stayed Republican-leaning throughout.</p><p class="nt">Note: Daily closing midpoints from Polymarket&#x27;s public price-history API. Odds are not polls; markets can be moved by a few large traders, and US users trade mainly on regulated venues such as Kalshi.</p><p>Sources: <a href="https://polymarket.com/event/texas-senate-election-winner">Polymarket, Texas Senate Election Winner</a> <a href="https://polymarket.com/event/ohio-senate-election-winner">Polymarket, Ohio Senate Election Winner</a> <a href="https://polymarket.com/event/maine-senate-election-winner">Polymarket, Maine Senate Election Winner</a> <a href="https://polymarket.com/event/alaska-senate-election-winner">Polymarket, Alaska Senate Election Winner</a> <a href="https://polymarket.com/event/iowa-senate-election-winner">Polymarket, Iowa Senate Election Winner</a> <a href="https://polymarket.com/event/kansas-senate-election-winner">Polymarket, Kansas Senate Election Winner</a> <a href="https://polymarket.com/event/michigan-senate-election-winner">Polymarket, Michigan Senate Election Winner</a> <a href="https://docs.polymarket.com/developers/CLOB/timeseries">Polymarket CLOB price-history API</a></p></figcaption></figure></main></body></html>
