<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q6</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q6")</script></head><body><main id="issue"><h2 class="desk">Q6. Fed Odds</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-08-P11.webp" alt="Bettors still price a December Fed hike after the election and the selloff" loading="lazy"><figcaption><span class="t">Chart P11 (week of Nov 8, 2026). Bettors still price a December Fed hike after the election and the selloff</span><p>Polymarket’s still-open “Fed Decision in December?” market prices a 25-basis-point hike at 76.5% as of this fetch (Nov 8), with no-change at 21.5% and a 25 bp cut at 0.7%. The hike contract was about 72.5% at the Nov 2 close (hold 25.5%) and is 76.5% now. A Nov 7 recap of CME FedWatch put the December 25 bp hike at 76.8% on Friday Nov 6, up from 66.9% a week earlier, after October payrolls rose 165,000; that is essentially the same reading as Polymarket’s 76.5%. The election (Nov 3) and the Nov 5 equity selloff did not knock hike odds off their perch; the larger move was the post-jobs-report firming already visible in FedWatch.</p><ul><li>Polymarket now: 25 bp hike 76.5%, hold 21.5%, 25 bp cut 0.7%.</li><li>Nov 2 (day before the election): hike about 72.5%, hold 25.5%.</li><li>CME FedWatch via 24/7 Wall St: 76.8% hike on Nov 6, vs 66.9% a week earlier, after +165k October payrolls.</li></ul><p class="nt">Note: The older Polymarket slug fed-decision-in-december is a prior-year market that already resolved to a 25 bp cut and is not used here. Index-style ICE/CME probabilities are futures-implied, not official Fed guidance; 24/7 Wall St is a secondary recap of FedWatch because CME’s own JSON was not captured in this run. Economist-survey comparisons were not fetched as a primary file this run, so they are omitted rather than guessed.</p><p>Sources: <a href="https://polymarket.com/event/fed-decision-in-december-20260729232808632">Polymarket: Fed Decision in December?</a> <a href="https://docs.polymarket.com/developers/CLOB/timeseries">Polymarket CLOB prices-history API</a> <a href="https://247wallst.com/investing/2026/11/07/odds-of-a-december-rate-hike-jump-to-77-after-a-blowout-jobs-report/">24/7 Wall St recap of CME FedWatch, Nov 7, 2026 (76.8% on Nov 6; 66.9% a week earlier)</a> <a href="https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html">CME FedWatch Tool</a></p></figcaption></figure></main></body></html>
