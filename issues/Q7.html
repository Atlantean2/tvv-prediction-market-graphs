<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q7</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. Inflation Bets</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-P12.webp" alt="Bettors vs the IMF on 2026 inflation: same call in 4 of 8 economies, split on the rest" loading="lazy"><figcaption><span class="t">Chart P12 (week of Nov 15, 2026). Bettors vs the IMF on 2026 inflation: same call in 4 of 8 economies, split on the rest</span><p>Each panel shows Polymarket&#x27;s probability for every range of December-2026 year-on-year consumer-price inflation (blue bars; prices as of Nov 15 2026, normalised to sum to 100%), with the bin containing the IMF&#x27;s end-2026 projection highlighted in red (IMF World Economic Outlook, end-of-period consumer prices). The market&#x27;s most likely range contains the IMF figure for Euro area, Mexico, South Korea, United Kingdom. The two disagree for Argentina (IMF 29.5%, market gives that range 3%; its favourite is 30.0-34.9% at 93%); Brazil (IMF 4.8%, market gives that range 19%; its favourite is 5.00-5.49% at 54%); China (IMF 1.3%, market gives that range 6%; its favourite is 0.6 – 1.0% at 51%); South Africa (IMF 5.4%, market gives that range 27%; its favourite is 4.7-5.0% at 57%). Bettors lean hotter than the IMF in Argentina (by a hair: 29.5% sits just under the market&#x27;s favoured 30–34.9% range) and Brazil, and cooler in China and South Africa. With December only weeks away, the markets can price monthly CPI data released after the IMF&#x27;s projections were made.</p><ul><li>Argentina: IMF 29.5%; market favourite 30.0-34.9% (93%); trading volume about $101K.</li><li>Brazil: IMF 4.8%; market favourite 5.00-5.49% (54%); trading volume about $236K.</li><li>China: IMF 1.3%; market favourite 0.6 – 1.0% (51%); trading volume about $143K.</li><li>Euro area: IMF 3.8%; market favourite 3.1%+ (88%); trading volume about $123K.</li><li>Mexico: IMF 3.6%; market favourite 3.50% to 3.99% (46%); trading volume about $126K.</li><li>South Africa: IMF 5.4%; market favourite 4.7-5.0% (57%); trading volume about $131K.</li><li>South Korea: IMF 2.8%; market favourite 2.7% to 2.9% (51%); trading volume about $99K.</li><li>United Kingdom: IMF 3.8%; market favourite 3.5–3.9% (64%); trading volume about $168K.</li></ul><p class="nt">Note: Each market resolves on the official 12-month CPI change for December 2026 (INDEC, IBGE IPCA, NBS, Eurostat HICP, INEGI, Stats SA, Korea MODS, ONS). Prices are &#x27;Yes&#x27; prices for each range and are normalised because they sum to slightly more or less than 100%. Several of these markets are thin (tens of thousands of dollars). The IMF figure is the DataMapper&#x27;s current WEO vintage; the IMF projects the year-end value, matching the markets&#x27; definition.</p><p>Sources: <a href="https://polymarket.com/event/argentina-annual-inflation-2026">Polymarket event pages (Gamma API JSON pulled Nov 15 2026): Argentina</a> <a href="https://polymarket.com/event/brazil-annual-inflation-2026">Polymarket: Brazil 2026 annual inflation</a> <a href="https://polymarket.com/event/china-annual-inflation-2026">Polymarket: China</a> <a href="https://polymarket.com/event/eurozone-2026-annual-inflation">Polymarket: Eurozone</a> <a href="https://polymarket.com/event/mexico-annual-inflation-2026">Polymarket: Mexico</a> <a href="https://polymarket.com/event/south-africa-annual-inflation-2026">Polymarket: South Africa</a> <a href="https://polymarket.com/event/south-korea-annual-inflation-2026">Polymarket: South Korea</a> <a href="https://polymarket.com/event/uk-annual-inflation-in-2026">Polymarket: UK</a> <a href="https://www.imf.org/external/datamapper/PCPIEPCH@WEO">IMF DataMapper: inflation, end of period consumer prices (PCPIEPCH)</a></p></figcaption></figure></main></body></html>
