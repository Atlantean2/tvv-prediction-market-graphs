<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Graphs — Q8</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q8")</script></head><body><main id="issue"><h2 class="desk">Q8. Fed Path Bets</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-P13.webp" alt="Bettors give a December Fed hike 87%, but two hikes less than half the officials&#x27; odds" loading="lazy"><figcaption><span class="t">Chart P13 (week of Nov 15, 2026). Bettors give a December Fed hike 87%, but two hikes less than half the officials&#x27; odds</span><p>Left: where Fed officials, in their September 16 2026 projections, saw the upper bound of the federal funds target at the end of 2026 (gold, count of participants) versus Polymarket&#x27;s current odds (blue). Right: how those odds moved since September 1. The Fed raised rates on September 16 to 3.75–4.00%, its first hike since 2023; 12 of 18 officials pencilled in one more hike by year-end, 4 wanted two, and 2 none. On September 1 bettors gave only 18% to ending the year at 4.25% and 25% to no hike at all; today 4.25% trades at 87%. The market agrees with the median but trims both tails: 9.4% for two or more hikes (versus 22% of officials) and 4.1% for a December hold (versus 11%).</p><ul><li>Current Polymarket prices: 3.75% 0.9%, 4.0% 4.1%, 4.25% 87.1%, ≥ 4.5% 9.4% (lower bins under 1% each).</li><li>Fed SEP medians for 2026 (Sep 16): PCE inflation 3.7%, core PCE 3.4%, unemployment 4.1%, GDP growth 2.3%. October unemployment printed 4.1% (FRED UNRATE).</li><li>The only FOMC meeting left in 2026 is December 8–9; the market resolves on the upper bound after it.</li><li>Dots are rounded midpoints of the target range; we map 4.375 to an upper bound of 4.50%, 4.125 to 4.25% and 3.875 to 4.00%.</li></ul><p class="nt">Note: Polymarket&#x27;s &#x27;Yes&#x27; prices are probabilities; total across bins sums to about 100%. The September dot plot is two months old; officials will publish new dots at the December meeting. The September Figure 2 shows 18 dots for 2026 (one fewer than a full committee of 19).</p><p>Sources: <a href="https://polymarket.com/event/what-will-the-fed-rate-be-at-the-end-of-2026">Polymarket: What will the Fed rate be at the end of 2026?</a> <a href="https://docs.polymarket.com/developers/CLOB/timeseries">Polymarket CLOB price history API (hourly prices, Sep 1–Nov 15 2026)</a> <a href="https://www.federalreserve.gov/monetarypolicy/fomcprojtabl20260916.htm">Federal Reserve: Summary of Economic Projections, Sep 16 2026 (Figure 2 dot plot)</a> <a href="https://fred.stlouisfed.org/series/DFEDTARU">FRED: federal funds target range upper limit (DFEDTARU)</a> <a href="https://x.com/clearmarkdaily/status/2121274450389897416">X: market post noting &#x27;a December hike already priced in&#x27; as the 10-year hit 5.16% on Nov 13</a></p></figcaption></figure></main></body></html>
